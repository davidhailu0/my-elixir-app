services:
  - type: web
    name: phoenix-app
    env: elixir
    plan: free
    buildCommand: "./build.sh"
    startCommand: "_build/prod/rel/my_live_app/bin/my_live_app start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: live-app-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
databases:
  - name: live-app-db
    plan: free
